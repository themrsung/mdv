<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MDV file">
  <!--
    File icon for the `mdv` language (SPEC 29.2 `languages[].icon.light`).
    Drawn for a light UI: dark ink on the editor's light background, so the
    glyph is legible without a fill of its own. Geometry only — no text
    element, because a file icon is rendered at 16 px where any label is mud,
    and no external font may be referenced from a bundled icon.
  -->
  <path d="M6.5 2.5h12.5L26 9.5v20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-26a1 1 0 0 1 .5-1z"
        fill="#ffffff" stroke="#3b3b3b" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M19 2.5V9a1 1 0 0 0 1 1h6" fill="none" stroke="#3b3b3b" stroke-width="1.4"
        stroke-linejoin="round"/>
  <!-- Three bars: the smallest possible drawing that reads as "a chart". -->
  <rect x="9.5" y="20" width="3.4" height="6" rx="0.6" fill="#3b6ea5"/>
  <rect x="14.3" y="16" width="3.4" height="10" rx="0.6" fill="#3b6ea5"/>
  <rect x="19.1" y="12.5" width="3.4" height="13.5" rx="0.6" fill="#1f4a75"/>
</svg>
