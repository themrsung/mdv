@media (forced-colors:active){.mdv-root{--mdv-surface:Canvas;--mdv-page:Canvas;--mdv-text-primary:CanvasText;--mdv-text-secondary:CanvasText;--mdv-text-muted:GrayText;--mdv-grid:GrayText;--mdv-axis:CanvasText;--mdv-border:CanvasText;--mdv-success-text:CanvasText;forced-color-adjust:none;color:CanvasText}
.mdv-root .mdv-tooltip{background:Canvas;border-color:CanvasText;color:CanvasText}
.mdv-root .mdv-focus-ring{stroke:Highlight}}
