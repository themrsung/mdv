<svg xmlns="http://www.w3.org/2000/svg" class="mdv-root mdv-chart" width="800" height="300" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mdv-0-title mdv-0-desc" data-mdv-kind="ohlcv"><style>.mdv-root{--mdv-surface:#fcfcfb;--mdv-page:#f9f9f7;--mdv-text-primary:#0b0b0b;--mdv-text-secondary:#52514e;--mdv-text-muted:#898781;--mdv-grid:#e1e0d9;--mdv-axis:#c3c2b7;--mdv-border:rgba(11,11,11,0.10);--mdv-success-text:#006300;--mdv-radius:4px;--mdv-hairline:1px;--mdv-gap:2px;--mdv-ring:2px;--mdv-font:system-ui,-apple-system,"Segoe UI",sans-serif;--mdv-font-size:13px;--mdv-line-height:1.4;display:block;position:relative;font-family:var(--mdv-font);font-size:var(--mdv-font-size);line-height:var(--mdv-line-height);color:var(--mdv-text-primary)}
.mdv-root .mdv-chart,.mdv-root.mdv-chart{display:block;max-width:100%;overflow:visible;-webkit-tap-highlight-color:transparent}
.mdv-root .mdv-chart:focus{outline:none}
