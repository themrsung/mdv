.mdv-root .mdv-readout-value{font-variant-numeric:tabular-nums}
.mdv-root .mdv-readout-label{color:var(--mdv-text-secondary)}
.mdv-root .mdv-live{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.mdv-root .mdv-error-card{border:var(--mdv-hairline) solid var(--mdv-border);border-radius:var(--mdv-radius);padding:12px;background:var(--mdv-surface)}
